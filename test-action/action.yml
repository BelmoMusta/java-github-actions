name: 'Java GitHub Actions'
branding:
  icon: activity
  color: purple
description:
  'Executes an action using java code'
author: 'Mustapha Belmokhtar'
inputs:
  java-class:
    description: "Main class"
    required: true
  test:
    description: 'test input'
    required: false
    default: "000000"

runs:
  using: "composite"
  steps:
    - name: Setup inputs
      id: setup-inputs
      run: |
        echo "__inputs<<EOF" >> $GITHUB_OUTPUT
        echo "$__INPUTS_AS_JSON" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        __INPUTS_AS_JSON: "${{ toJSON(inputs) }}"
      shell: bash
    - name: Execute java code
      run: |
        ./mvnw clean install &>/dev/null
        java -jar target/java-github-actions-1.0.0-SNAPSHOT-jar-with-dependencies.jar
      shell: bash
      env:
        __INPUTS: ${{ steps.setup-inputs.outputs.__inputs }}
        __MAIN_CLASS: ${{ inputs.java-class }}