name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-job:
    name: Test Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Uses the java action
        uses: ./test-action
        with:
          test: '000001'
        env: ${{ inputs }}
      - name: Shell debug
        run: |
          echo "env ----------"
          env
          echo "env ----------"
        env:
          INPUT_TEST: 000000
          JSON: ${{ toJSON(inputs) }}
